<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>ليكي بس ❤️</title>
<style>
body{background:linear-gradient(pink,#ff99cc);text-align:center;padding:50px;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:40px;border-radius:20px;box-shadow:0 0 20px rgba(0,0,0,0.2)}
#heart{font-size:80px;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.3)}}
button{padding:15px 30px;border:none;border-radius:20px;background:red;color:white;font-size:18px;margin-top:15px;cursor:pointer}
input{padding:12px;border:2px solid pink;border-radius:10px;font-size:16px;text-align:center}
.hidden{display:none}
</style>
</head><body>

<div class="box" id="login">
  <h2>🔒 الموقع ده ليكي انتي بس</h2>
  <p>اكتبي كلمة السر</p>
  <input type="password" id="pass" placeholder="كلمة السر">
  <br>
  <button onclick="check()">ادخلي</button>
  <p id="error" style="color:red"></p>
</div>

<div class="box hidden" id="main">
  <div id="heart">❤️</div>
  <h1>سامحيني</h1>
  <p>ده قلبي بين ايديكي</p>
  <button onclick="m.play()">دوسي هنا شغلي الأغنية 🎵</button>
  <audio id="m" loop src="https://ia800905.us.archive.org/25/items/RaghebAlamaAlbiAshiqha/Ragheb%20Alama%20-%20Albi%20Ashiqha.mp3"></audio>
</div>

<script>
function check(){
  if(document.getElementById('pass').value.toLowerCase() === 'love'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  } else {
    document.getElementById('error').innerText = 'كلمة السر غلط جربي love';
  }
}
</script>

</body></html>
